<div class="stack">
    <section class="panel">
        <div class="page-header">
            <div>
                <h2>Add fixed asset</h2>
                <p class="page-context">All fields except the image are required.</p>
            </div>
            <div class="page-actions">
                <a href="{{ back_href }}">← Back to fixed assets</a>
            </div>
        </div>

        <section class="section-card">
        <form method="post" action="/fixed-assets/add" class="asset-form" enctype="multipart/form-data">
            <input type="hidden" name="page" value="{{ page }}" />
            <input type="hidden" name="page_size" value="{{ page_size }}" />
            <input type="hidden" name="name_filter" value="{{ filters.name }}" />
            <input type="hidden" name="category_filter" value="{{ filters.category }}" />
            <input type="hidden" name="initial_value_from_filter" value="{{ filters.initial_value_from }}" />
            <input type="hidden" name="initial_value_to_filter" value="{{ filters.initial_value_to }}" />
            <input type="hidden" name="responsible_person_filter" value="{{ filters.responsible_person }}" />
            <input type="hidden" name="registration_date_from_filter" value="{{ filters.registration_date_from }}" />
            <input type="hidden" name="registration_date_to_filter" value="{{ filters.registration_date_to }}" />
            <div class="asset-form-row">
                <div>
                    <label for="name">Name</label>
                    <input id="name" name="name" type="text" maxlength="100" value="{{ form_data.name }}" required />
                </div>
                <div>
                    <label for="category_id">Category</label>
                    <select id="category_id" name="category_id" required>
                        <option value="">Select category</option>
                        {% for category in categories %}
                        <option value="{{ category.id }}" {% if category.id == selected_category_id %}selected{% endif %}>{{ category.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="asset-form-row">
                <div>
                    <label for="quantity">Quantity</label>
                    <input id="quantity" name="quantity" type="number" min="0" step="1" value="{{ form_data.quantity }}" required />
                </div>
                <div>
                    <label for="initial_value">Initial value</label>
                    <input id="initial_value" name="initial_value" type="number" step="0.01" min="0" value="{{ form_data.initial_value }}" required />
                </div>
            </div>
            <div class="asset-form-row">
                <div>
                    <label for="responsible_person">Responsible person</label>
                    <input id="responsible_person" name="responsible_person" type="text" maxlength="100" value="{{ form_data.responsible_person }}" required />
                </div>
                <div>
                    <label for="registration_date">Registration date</label>
                    <input id="registration_date" name="registration_date" type="date" value="{{ form_data.registration_date }}" required />
                </div>
            </div>
            <div class="asset-form-row">
                <div>
                    <label for="image">Asset image (optional)</label>
                    <input id="image" name="image" type="file" accept=".png,.jpg,.jpeg,.gif,.webp,image/*" />
                </div>
            </div>
            <div class="actions-bar">
                <button type="submit">Save fixed asset</button>
                <a href="{{ back_href }}">Cancel</a>
            </div>
        </form>
        </section>
    </section>
</div>
