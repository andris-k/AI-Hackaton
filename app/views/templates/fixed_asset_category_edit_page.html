<div class="stack">
    <section class="panel">
        <div class="page-header">
            <div>
                <h2>Edit category</h2>
                <p class="page-context">Renaming a category changes how every asset in it is grouped.</p>
            </div>
            <div class="page-actions">
                <a href="/fixed-asset-categories">← Back to categories</a>
            </div>
        </div>

        <section class="section-card">
            <form method="post" action="/fixed-asset-categories/{{ category.id }}/edit">
                <div class="field">
                    <label for="category_name">Category name</label>
                    <input id="category_name" name="name" type="text" maxlength="100" value="{{ category.name }}" required />
                </div>
                <p class="mono" style="margin: 0 0 14px;">Id {{ category.id }}</p>
                <div class="button-row">
                    <button type="submit">Save category</button>
                    <a href="/fixed-asset-categories">Cancel</a>
                </div>
            </form>
        </section>
    </section>
</div>
