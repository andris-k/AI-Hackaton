<div class="stack">
    <section class="panel">
        <div class="page-header">
            <div>
                <h2>Edit {{ fixed_asset.name }}</h2>
                <p class="page-context">Asset <span class="mono">{{ fixed_asset.id }}</span></p>
            </div>
            <div class="page-actions">
                <a href="{{ back_href }}">← Fixed assets</a>
                <a href="{{ details_href }}">View details</a>
            </div>
        </div>

        <section class="section-card">
        <form method="post" action="/fixed-assets/id/{{ fixed_asset.id }}/edit" class="asset-form" enctype="multipart/form-data">
            <input type="hidden" name="page" value="{{ page }}" />
            <input type="hidden" name="page_size" value="{{ page_size }}" />
            <input type="hidden" name="name_filter" value="{{ filters.name }}" />
            <input type="hidden" name="category_filter" value="{{ filters.category }}" />
            <input type="hidden" name="location_filter" value="{{ filters.location }}" />
            <input type="hidden" name="initial_value_from_filter" value="{{ filters.initial_value_from }}" />
            <input type="hidden" name="initial_value_to_filter" value="{{ filters.initial_value_to }}" />
            <input type="hidden" name="responsible_person_filter" value="{{ filters.responsible_person }}" />
            <input type="hidden" name="registration_date_from_filter" value="{{ filters.registration_date_from }}" />
            <input type="hidden" name="registration_date_to_filter" value="{{ filters.registration_date_to }}" />
            <div class="asset-form-row">
                <div>
                    <label for="name">Name</label>
                    <input id="name" name="name" type="text" maxlength="100" value="{{ fixed_asset.name }}" required />
                </div>
                <div>
                    <label for="category_id">Category</label>
                    <select id="category_id" name="category_id" required>
                        {% for category in categories %}
                        <option value="{{ category.id }}" {% if category.id == selected_category_id %}selected{% endif %}>{{ category.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="asset-form-row">
                <div>
                    <label for="location_id">Location (optional)</label>
                    <select id="location_id" name="location_id">
                        <option value="">No location</option>
                        {% for location in locations %}
                        <option value="{{ location.id }}" {% if location.id == selected_location_id %}selected{% endif %}>{{ location.name }}</option>
                        {% endfor %}
                    </select>
                    {% if not locations %}<p style="margin: 5px 0 0; color: var(--muted); font-size: 0.8rem;">No locations yet. <a href="/locations">Add locations</a></p>{% endif %}
                </div>
            </div>
            <div class="asset-form-row">
                <div>
                    <label for="quantity">Quantity</label>
                    <input id="quantity" name="quantity" type="number" min="0" step="1" value="{{ fixed_asset.quantity }}" required />
                </div>
                <div>
                    <label for="initial_value">Initial value</label>
                    <input id="initial_value" name="initial_value" type="number" step="0.01" min="0" value="{{ fixed_asset.initial_value }}" required />
                </div>
            </div>
            <div class="asset-form-row">
                <div>
                    <label for="responsible_person">Responsible person</label>
                    <input id="responsible_person" name="responsible_person" type="text" maxlength="100" value="{{ fixed_asset.responsible_person }}" required />
                </div>
                <div>
                    <label for="registration_date">Registration date</label>
                    <input id="registration_date" name="registration_date" type="date" value="{{ fixed_asset.registration_date }}" required />
                </div>
            </div>
            <div class="asset-form-row">
                <div>
                    <label for="image">Replace image (optional)</label>
                    <input id="image" name="image" type="file" accept=".png,.jpg,.jpeg,.gif,.webp,image/*" />
                    {% if fixed_asset.image_url %}
                    <div class="image-preview">
                        <img src="{{ fixed_asset.image_url }}" alt="{{ fixed_asset.name }} image" />
                        <a href="{{ fixed_asset.image_url }}" target="_blank" rel="noopener">Open current image</a>
                    </div>
                    {% endif %}
                </div>
            </div>
            <div class="actions-bar">
                <button type="submit">Save changes</button>
                <a href="{{ details_href }}">Cancel</a>
            </div>
        </form>
        </section>

        <div class="danger-zone">
            <p><strong>Delete this fixed asset</strong>The record and its image are removed permanently.</p>
            <form method="post" action="/fixed-assets/id/{{ fixed_asset.id }}/delete" onsubmit="return confirm('Delete this fixed asset?');">
                <input type="hidden" name="page" value="{{ page }}" />
                <input type="hidden" name="page_size" value="{{ page_size }}" />
                <input type="hidden" name="name_filter" value="{{ filters.name }}" />
                <input type="hidden" name="category_filter" value="{{ filters.category }}" />
                <input type="hidden" name="location_filter" value="{{ filters.location }}" />
                <input type="hidden" name="initial_value_from_filter" value="{{ filters.initial_value_from }}" />
                <input type="hidden" name="initial_value_to_filter" value="{{ filters.initial_value_to }}" />
                <input type="hidden" name="responsible_person_filter" value="{{ filters.responsible_person }}" />
                <input type="hidden" name="registration_date_from_filter" value="{{ filters.registration_date_from }}" />
                <input type="hidden" name="registration_date_to_filter" value="{{ filters.registration_date_to }}" />
                <button type="submit" class="btn-danger">Delete fixed asset</button>
            </form>
        </div>
    </section>
</div>
