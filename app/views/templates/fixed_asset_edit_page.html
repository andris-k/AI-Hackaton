<style>
    .page-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 12px;
    }
    .page-header h2 {
        margin: 0;
    }
    .page-context {
        margin: 4px 0 0;
        color: var(--muted, #6b6055);
        font-size: 0.85rem;
    }
    .page-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
    }
    .page-actions a {
        text-decoration: none;
    }
    .page-actions button {
        width: auto;
        white-space: nowrap;
        padding: 8px 12px;
    }
    .section-card {
        border: 1px solid var(--border, #d6cfc7);
        border-radius: 12px;
        background: #fff;
        padding: 12px;
    }
    .section-card h3 {
        margin: 0 0 10px;
        font-size: 1rem;
    }
    .summary-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 14px;
    }
    @media (max-width: 760px) {
        .summary-grid {
            grid-template-columns: 1fr;
        }
    }
    .summary-card {
        border: 1px solid var(--border, #d6cfc7);
        border-radius: 12px;
        background: linear-gradient(180deg, #fff 0%, #fcfaf6 100%);
        padding: 12px;
    }
    .summary-card p {
        margin: 0;
        color: var(--muted, #6b6055);
        font-size: 0.82rem;
    }
    .summary-card strong {
        display: block;
        margin-top: 4px;
        font-size: 1.15rem;
    }
    .asset-form {
        display: grid;
        gap: 12px;
    }

    .asset-form-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
    }

    @media (max-width: 760px) {
        .asset-form-row { grid-template-columns: 1fr; }
    }
</style>
<div class="stack">
    <section class="panel">
        <div class="page-header">
            <div>
                <h2>Edit fixed asset</h2>
                <p class="page-context">Signed in as <strong>{{ current_email }}</strong>. Update the asset and keep the current filter context.</p>
            </div>
            <div class="page-actions">
                <a href="{{ details_href }}"><button type="button">← Back to details</button></a>
                <a href="{{ back_href }}"><button type="button">← Fixed Assets</button></a>
            </div>
        </div>

        <div class="summary-grid">
            <article class="summary-card">
                <p>Asset id</p>
                <strong>{{ fixed_asset.id }}</strong>
            </article>
            <article class="summary-card">
                <p>Current category</p>
                <strong>{{ fixed_asset.category }}</strong>
            </article>
        </div>

        <section class="section-card">
            <h3>Edit fixed asset</h3>
        <form method="post" action="/fixed-assets/id/{{ fixed_asset.id }}/edit" class="asset-form">
            <input type="hidden" name="page" value="{{ page }}" />
            <input type="hidden" name="page_size" value="{{ page_size }}" />
            <input type="hidden" name="name_filter" value="{{ filters.name }}" />
            <input type="hidden" name="category_filter" value="{{ filters.category }}" />
            <input type="hidden" name="initial_value_from_filter" value="{{ filters.initial_value_from }}" />
            <input type="hidden" name="initial_value_to_filter" value="{{ filters.initial_value_to }}" />
            <input type="hidden" name="responsible_person_filter" value="{{ filters.responsible_person }}" />
            <input type="hidden" name="registration_date_from_filter" value="{{ filters.registration_date_from }}" />
            <input type="hidden" name="registration_date_to_filter" value="{{ filters.registration_date_to }}" />
            <div class="asset-form-row">
                <div>
                    <label for="name">Name</label>
                    <input id="name" name="name" type="text" maxlength="100" value="{{ fixed_asset.name }}" required />
                </div>
                <div>
                    <label for="category">Category</label>
                    <select id="category_id" name="category_id" required>
                        {% for category in categories %}
                        <option value="{{ category.id }}" {% if category.id == selected_category_id %}selected{% endif %}>{{ category.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="asset-form-row">
                <div>
                    <label for="initial_value">Initial value</label>
                    <input id="initial_value" name="initial_value" type="number" step="0.01" min="0" value="{{ fixed_asset.initial_value }}" required />
                </div>
                <div>
                    <label for="responsible_person">Responsible person</label>
                    <input id="responsible_person" name="responsible_person" type="text" maxlength="100" value="{{ fixed_asset.responsible_person }}" required />
                </div>
            </div>
            <div class="asset-form-row">
                <div>
                    <label for="registration_date">Registration date</label>
                    <input id="registration_date" name="registration_date" type="date" value="{{ fixed_asset.registration_date }}" required />
                </div>
            </div>
            <button type="submit">Save changes</button>
        </form>
        </section>
        <form method="post" action="/fixed-assets/id/{{ fixed_asset.id }}/delete" onsubmit="return confirm('Delete this fixed asset?');" style="margin-top: 12px;">
            <input type="hidden" name="page" value="{{ page }}" />
            <input type="hidden" name="page_size" value="{{ page_size }}" />
            <input type="hidden" name="name_filter" value="{{ filters.name }}" />
            <input type="hidden" name="category_filter" value="{{ filters.category }}" />
            <input type="hidden" name="initial_value_from_filter" value="{{ filters.initial_value_from }}" />
            <input type="hidden" name="initial_value_to_filter" value="{{ filters.initial_value_to }}" />
            <input type="hidden" name="responsible_person_filter" value="{{ filters.responsible_person }}" />
            <input type="hidden" name="registration_date_from_filter" value="{{ filters.registration_date_from }}" />
            <input type="hidden" name="registration_date_to_filter" value="{{ filters.registration_date_to }}" />
            <button type="submit" style="width: auto; min-width: 180px; background: #b91c1c; border-color: #b91c1c;">Delete fixed asset</button>
        </form>
    </section>
</div>
