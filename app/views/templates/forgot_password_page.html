{% if reset_available %}
<form method="post" action="/forgot-password">
    <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" value="{{ email }}" placeholder="name@example.com" required />
    </div>
    <button type="submit">{% if link_on_screen %}Generate reset link{% else %}Send reset link{% endif %}</button>
</form>
{% endif %}
<div class="links">
    <a href="/">Back to login</a>
    <a href="/register">Create account</a>
</div>
{% if link_on_screen %}
<p class="small">For local testing, the reset link is displayed on screen instead of being emailed.</p>
{% endif %}
