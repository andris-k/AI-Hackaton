<div class="stack">
    <section class="panel">
        <div class="page-header">
            <div>
                <h2>New inventory session</h2>
                <p class="page-context">New sessions start in <strong>New</strong> status. Linked assets are added once the session is started.</p>
            </div>
            <div class="page-actions">
                <a href="/inventory-sessions">← Back to sessions</a>
            </div>
        </div>
        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        <form method="post" action="/inventory-sessions/add" class="session-form">
            <section class="section-card">
                <h3 class="section-title">Session</h3>
                <div class="session-form">
                    <div class="session-form-row">
                        <div>
                            <label for="date_from">Date from</label>
                            <input id="date_from" name="date_from" type="date"
                                   value="{{ prefill.date_from if prefill else '' }}" required />
                        </div>
                        <div>
                            <label for="date_to">Date to</label>
                            <input id="date_to" name="date_to" type="date"
                                   value="{{ prefill.date_to if prefill else '' }}" required />
                        </div>
                    </div>
                    <div>
                        <label for="responsible_person">Responsible person</label>
                        <input id="responsible_person" name="responsible_person" type="text" maxlength="100"
                               value="{{ prefill.responsible_person if prefill else '' }}" required />
                    </div>
                    <div>
                        <label for="location_id">Location (optional)</label>
                        <select id="location_id" name="location_id">
                            <option value="">All locations</option>
                            {% for location in locations %}
                            <option value="{{ location.id }}" {% if prefill and prefill.location_id == location.id %}selected{% endif %}>{{ location.name }}</option>
                            {% endfor %}
                        </select>
                        <p style="margin: 5px 0 0; color: var(--muted); font-size: 0.8rem;">With a location, only assets at it can be added to the session.</p>
                    </div>
                    <div>
                        <label for="notes">Notes (optional)</label>
                        <textarea id="notes" name="notes" rows="3" maxlength="1500" placeholder="Context for the upcoming inventory session">{{ prefill.notes if prefill else '' }}</textarea>
                    </div>
                </div>
            </section>

            <div class="actions-bar">
                <button type="submit">Create session</button>
                <a href="/inventory-sessions">Cancel</a>
            </div>
        </form>
    </section>
</div>
