<style>
    .detail-grid {
        display: grid;
        grid-template-columns: 160px 1fr;
        gap: 8px 16px;
        margin-bottom: 20px;
    }
    .detail-grid dt { font-weight: 600; color: var(--muted, #6b6055); }
    .detail-grid dd { margin: 0; }
    .badge {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 12px;
        font-size: 0.85em;
        font-weight: 600;
        background: var(--border, #d6cfc7);
        color: var(--fg, #1a1a18);
    }
    .badge-new       { background: #cfe2ff; color: #0a3678; }
    .badge-active    { background: #d1fae5; color: #064e3b; }
    .badge-completed { background: #e0e7ff; color: #3730a3; }
    .badge-cancelled { background: #fee2e2; color: #7f1d1d; }
</style>
<div class="stack">
    <section class="panel">
        <h2>Inventory Session</h2>
        <p>Signed in as <strong>{{ current_email }}</strong>.</p>

        <dl class="detail-grid">
            <dt>Date From</dt>
            <dd>{{ inv_session.date_from }}</dd>

            <dt>Date To</dt>
            <dd>{{ inv_session.date_to }}</dd>

            <dt>Status</dt>
            <dd><span class="badge badge-{{ inv_session.status | lower }}">{{ inv_session.status }}</span></dd>

            <dt>Responsible</dt>
            <dd>{{ inv_session.responsible_person }}</dd>
        </dl>

        <div style="display:flex; gap:10px; align-items:center; flex-wrap: wrap;">
            <a href="/inventory-sessions/id/{{ inv_session.id }}/edit">
                <button>Edit</button>
            </a>
            <a href="/inventory-sessions"><button type="button">Back to list</button></a>
            <form method="post" action="/inventory-sessions/id/{{ inv_session.id }}/delete" style="display:inline;"
                  onsubmit="return confirm('Delete this inventory session? This cannot be undone.')">
                <button type="submit" style="background: #b91c1c; color: #fff; border-color: #b91c1c;">Delete</button>
            </form>
        </div>
    </section>
</div>
