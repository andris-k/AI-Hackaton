<style>
    .session-form {
        display: grid;
        gap: 12px;
    }
    .session-form-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
    }
    @media (max-width: 760px) {
        .session-form-row { grid-template-columns: 1fr; }
    }
</style>
<div class="stack">
    <section class="panel">
        <h2>Edit Inventory Session</h2>
        <p>Signed in as <strong>{{ current_email }}</strong>.</p>
        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        <form method="post" action="/inventory-sessions/id/{{ inv_session.id }}/edit" class="session-form">
            <div class="session-form-row">
                <div>
                    <label for="date_from">Date From</label>
                    <input id="date_from" name="date_from" type="date"
                           value="{{ prefill.date_from if prefill else inv_session.date_from }}" required />
                </div>
                <div>
                    <label for="date_to">Date To</label>
                    <input id="date_to" name="date_to" type="date"
                           value="{{ prefill.date_to if prefill else inv_session.date_to }}" required />
                </div>
            </div>
            <div class="session-form-row">
                <div>
                    <label for="status">Status</label>
                    <select id="status" name="status" required>
                        {% for s in statuses %}
                        <option value="{{ s }}"
                            {% if (prefill and prefill.status == s) or (not prefill and inv_session.status == s) %}
                            selected
                            {% endif %}>{{ s }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label for="responsible_person">Responsible Person</label>
                    <input id="responsible_person" name="responsible_person" type="text" maxlength="100"
                           value="{{ prefill.responsible_person if prefill else inv_session.responsible_person }}"
                           required />
                </div>
            </div>
            <div style="display:flex; gap:10px; align-items:center; flex-wrap: wrap;">
                <button type="submit">Save</button>
                <a href="/inventory-sessions/id/{{ inv_session.id }}">
                    <button type="button">Cancel</button>
                </a>
                <form method="post" action="/inventory-sessions/id/{{ inv_session.id }}/delete"
                      style="display:inline;"
                      onsubmit="return confirm('Delete this inventory session? This cannot be undone.')">
                    <button type="submit" style="background: #b91c1c; color: #fff; border-color: #b91c1c;">Delete</button>
                </form>
            </div>
        </form>
    </section>
</div>
