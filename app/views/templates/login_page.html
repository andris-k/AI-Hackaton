<style>
    .login-shell {
        display: grid;
        gap: 12px;
    }
    .login-intro {
        border: 1px solid var(--border, #d6cfc7);
        border-radius: 12px;
        background: linear-gradient(180deg, #fff 0%, #fcfaf6 100%);
        padding: 12px;
    }
    .login-intro p {
        margin: 0;
        color: var(--muted, #6b6055);
        font-size: 0.9rem;
        line-height: 1.45;
    }
    .login-form-card {
        border: 1px solid var(--border, #d6cfc7);
        border-radius: 12px;
        background: #fff;
        padding: 12px;
    }
    .field-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
    }
    .show-password {
        width: auto;
        min-width: 0;
        padding: 4px 8px;
        font-size: 0.76rem;
    }
    .field-note {
        margin: 4px 0 0;
        color: #92400e;
        font-size: 0.8rem;
        display: none;
    }
    .links {
        margin-top: 10px;
    }
    .seeded-note {
        margin: 0;
        border: 1px solid var(--border, #d6cfc7);
        border-radius: 10px;
        background: var(--table-row-alt, #fcfaf6);
        padding: 10px;
        color: var(--muted, #6b6055);
        font-size: 0.84rem;
    }
</style>

<div class="login-shell">
    <section class="login-intro" aria-live="polite">
        <p>Sign in to access Fixed Assets, Inventory Sessions, Categories, and Users.</p>
    </section>

    <section class="login-form-card">
        <form method="post" action="/" id="login-form">
            <div class="field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" value="{{ email }}" placeholder="name@example.com" autocomplete="email" required />
            </div>
            <div class="field">
                <div class="field-head">
                    <label for="password" style="margin: 0;">Password</label>
                    <button type="button" id="toggle-password" class="show-password" aria-controls="password" aria-pressed="false">Show</button>
                </div>
                <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required />
                <p id="caps-lock-hint" class="field-note" role="status">Caps Lock appears to be on.</p>
            </div>
            <button type="submit">Log in</button>
        </form>
        <div class="links">
            <a href="/register">Create account</a>
            <a href="/forgot-password">Reset password</a>
        </div>
    </section>

    <p class="seeded-note">For local testing: admin@example.com / password123.</p>
</div>

<script>
    (function () {
        const passwordInput = document.getElementById("password");
        const toggleButton = document.getElementById("toggle-password");
        const capsHint = document.getElementById("caps-lock-hint");

        if (!passwordInput || !toggleButton || !capsHint) return;

        toggleButton.addEventListener("click", function () {
            const isHidden = passwordInput.type === "password";
            passwordInput.type = isHidden ? "text" : "password";
            toggleButton.textContent = isHidden ? "Hide" : "Show";
            toggleButton.setAttribute("aria-pressed", isHidden ? "true" : "false");
            passwordInput.focus();
        });

        function updateCapsHint(event) {
            const isCaps = event.getModifierState && event.getModifierState("CapsLock");
            capsHint.style.display = isCaps ? "block" : "none";
        }

        passwordInput.addEventListener("keydown", updateCapsHint);
        passwordInput.addEventListener("keyup", updateCapsHint);
        passwordInput.addEventListener("blur", function () {
            capsHint.style.display = "none";
        });
    })();
</script>
