<div class="stack">
    <section class="panel wide">
        <div class="page-header">
            <div>
                <h2>Users</h2>
                <p class="page-context">Browse registered accounts and filter by email.</p>
            </div>
        </div>

        <section class="section-card">
            <form method="get" action="/users">
                <div class="users-filter-row">
                    <div>
                        <label for="email_filter">Filter by email</label>
                        <input
                            id="email_filter"
                            name="email"
                            type="search"
                            value="{{ email_filter }}"
                            placeholder="Type part of an email"
                        />
                    </div>
                    <button type="submit">Apply filter</button>
                </div>
            </form>
        </section>

        <section class="section-card">
            <h3>Registered users <span class="filter-count">{{ users | length }}</span></h3>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th class="col-id num" style="width: 80px;">ID</th>
                            <th>Email</th>
                            <th class="col-created" style="width: 190px;">Created</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for user in users %}
                        <tr>
                            <td class="col-id num">{{ user.id }}</td>
                            <td>{{ user.email }}</td>
                            <td class="col-created">{{ user.created_at }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </section>
    </section>
</div>
